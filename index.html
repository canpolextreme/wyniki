<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wyniki zawodów — Canpol Extreme Chojnice</title>
<meta name="description" content="Wyniki zawodów kartingowych na krytym torze Canpol Extreme w Chojnicach.">
<meta name="theme-color" content="#eaf7fd">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('ix-js')</script>
<style>
:root{
  --ink:#0a1c28;--mut:#5d7384;--line:#d4e7f2;--ice:#eaf7fd;--mist:#f5fbfe;--sky:#9edcfb;--blue:#1aa6e8;--deep:#0b6fa6;--navy:#06304a;
  --ease:cubic-bezier(.22,1,.36,1);--ease2:cubic-bezier(.65,0,.35,1);
  --f:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--f);color:var(--ink);background:#fff;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
ul{list-style:none}
.wrap{width:min(1240px,90vw);margin-inline:auto}
section[id]{scroll-margin-top:0}
::selection{background:var(--sky);color:var(--navy)}

/* ---------- kurtyna (wejście / wyjście) ---------- */
.curtain{display:none}
.ix-js .curtain{display:grid;place-items:center;position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#fff 0%,var(--ice) 55%,var(--sky) 130%);transform-origin:50% 0;transition:transform .62s var(--ease2);pointer-events:all}
.ix-js.ix-ready .curtain{transform:scaleY(0);pointer-events:none}
.curtain.out{transform-origin:50% 100%!important;transform:scaleY(1)!important;pointer-events:all!important}
.curtain b{font-weight:200;letter-spacing:.5em;font-size:clamp(14px,2vw,22px);color:var(--navy);padding-left:.5em;transition:opacity .28s}
.ix-ready .curtain b{opacity:0}
.curtain b img{display:block;height:clamp(90px,20vw,170px);width:auto;margin:0 auto;animation:lgPulse 1.6s ease-in-out infinite alternate}
@keyframes lgPulse{from{opacity:.8;transform:scale(.97)}to{opacity:1;transform:scale(1.03)}}
.curtain i{display:block;width:min(260px,50vw);height:1px;background:var(--line);margin-top:22px;position:relative;overflow:hidden}
.curtain i::after{content:"";position:absolute;inset:0;background:var(--blue);transform:translateX(-100%);animation:load 1s var(--ease2) forwards}
@keyframes load{to{transform:none}}
.curtain div{text-align:center}

/* ---------- kursor-poświata ---------- */
.glow{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(26,166,232,.16),rgba(158,220,251,.08) 45%,transparent 70%);opacity:0;transition:opacity .41s}
.glow.on{opacity:1}

/* ---------- nagłówek ---------- */
.hd{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:90;width:min(1180px,92vw);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 12px 10px 24px;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(212,231,242,.9);box-shadow:0 8px 32px -12px rgba(11,111,166,.25);transition:transform .41s var(--ease),background .28s}
.hd.hide{transform:translate(-50%,-140%)}
.xlogo{height:54px;width:auto;display:block;margin:-6px 0;animation:xin .9s var(--ease) both,xglow 4s ease-in-out 1.5s infinite;transition:transform .21s}.brand:hover .xlogo{transform:scale(1.06) rotate(-1.5deg)}@keyframes xin{from{opacity:0;transform:translateX(-14px) scale(.9);filter:blur(6px)}}@keyframes xglow{50%{filter:drop-shadow(0 0 8px rgba(26,166,232,.55))}}
.brand{display:flex;align-items:center;gap:10px;font-size:18px}
.logo-burst{width:46px;height:46px;overflow:visible;margin:-6px 0}
.logo-burst .spin{transform-box:view-box;transform-origin:0 0;animation:burstSpin 28s linear 2s infinite}
.logo-burst .pt{transform-origin:0 0;transform:rotate(var(--r)) scale(0);animation:bloom 1s cubic-bezier(.34,1.56,.64,1) forwards,breathe 3.6s ease-in-out infinite;animation-delay:calc(1s + var(--i)*.07s),calc(2.6s + var(--i)*.18s)}
@keyframes bloom{from{transform:rotate(calc(var(--r) - 120deg)) scale(0)}to{transform:rotate(var(--r)) scale(1)}}
@keyframes breathe{0%,100%{transform:rotate(var(--r)) scale(1)}50%{transform:rotate(var(--r)) scale(.82)}}
@keyframes burstSpin{to{transform:rotate(360deg)}}
.brand:hover .spin{animation-duration:3s}
.lw{display:flex;gap:.12em;font-weight:600;letter-spacing:.2em;color:#2b2b2b}
.lw span{display:inline-block;opacity:0;transform:translateY(.6em) rotate(8deg);filter:blur(6px);animation:lin .8s var(--ease) forwards,lshine 5s ease-in-out infinite;animation-delay:calc(1.1s + var(--d)*.08s),calc(3s + var(--d)*.14s)}
@keyframes lin{to{opacity:1;transform:none;filter:none}}
@keyframes lshine{0%,70%,100%{color:#2b2b2b;transform:none}78%{color:#e6007e;transform:translateY(-.12em)}86%{color:#2b2b2b;transform:none}}
.brand:hover .lw span{animation:lhop .6s var(--ease) calc(var(--d)*.05s)}
@keyframes lhop{50%{transform:translateY(-.25em);color:#1aa6e8}}
.nav{position:relative;display:flex;gap:2px}
.nav a{position:relative;z-index:1;padding:9px 16px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--mut);transition:color .21s}
.nav a:hover,.nav a.cur{color:#fff}
.nav-ind{position:absolute;z-index:0;top:0;bottom:0;left:0;width:0;border-radius:999px;background:linear-gradient(110deg,var(--deep),var(--blue) 40%,var(--sky) 55%,var(--blue) 70%,var(--deep)) 0 0/250% 100%;box-shadow:0 6px 18px rgba(26,166,232,.45);animation:navflow 2.6s linear infinite;transition:left .35s var(--ease),width .35s var(--ease),opacity .21s;opacity:0}
@keyframes navflow{to{background-position:-250% 0}}
.cta{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;letter-spacing:.16em;position:relative;overflow:hidden;transition:transform .24s var(--ease);transform:translate(var(--mx,0),var(--my,0))}
.cta::before{content:"";position:absolute;inset:0;background:var(--blue);transform:translateY(101%);transition:transform .35s var(--ease)}
.cta span{position:relative}
.burger{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;position:relative}
.burger i{position:absolute;left:13px;right:13px;height:1.5px;background:var(--navy);transition:transform .35s var(--ease),top .35s var(--ease)}
.burger i:nth-child(1){top:18px}.burger i:nth-child(2){top:25px}
.menu-open .burger i:nth-child(1){top:21.5px;transform:rotate(45deg)}.menu-open .burger i:nth-child(2){top:21.5px;transform:rotate(-45deg)}
.mnav{position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,#fff,var(--ice));display:flex;flex-direction:column;justify-content:center;padding:0 8vw;clip-path:circle(0 at calc(100% - 44px) 44px);transition:clip-path .59s var(--ease2);visibility:hidden}
.menu-open .mnav{clip-path:circle(150% at calc(100% - 44px) 44px);visibility:visible}
.mnav a{font-size:clamp(34px,10vw,54px);font-weight:200;letter-spacing:-.02em;color:var(--navy);padding:6px 0;opacity:0;transform:translateY(24px);transition:opacity .41s var(--ease),transform .47s var(--ease)}
.mnav a b{font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--blue);margin-right:14px;vertical-align:middle}
.menu-open .mnav a{opacity:1;transform:none;transition-delay:calc(.25s + var(--i)*.06s)}

/* ---------- boczny pasek sekcji ---------- */
.rail{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:70;display:flex;flex-direction:column;gap:14px;align-items:flex-end}
.rail a{display:flex;align-items:center;gap:12px;font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--mut)}
.rail a span{opacity:0;transform:translateX(8px);transition:.28s var(--ease)}
.rail a i{display:block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--sky);background:#fff;transition:.28s var(--ease)}
.rail a.cur i{background:var(--blue);border-color:var(--blue);transform:scale(1.5);box-shadow:0 0 0 5px rgba(26,166,232,.18)}
.bar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:95;transform-origin:0 50%;transform:scaleX(var(--pg,0));background:linear-gradient(90deg,var(--sky),var(--blue))}

/* ---------- HERO ---------- */
.hero{height:240svh;position:relative}
.hero-frame{position:sticky;top:0;height:100svh;overflow:hidden;--p:0;background:linear-gradient(180deg,#fff 0%,var(--mist) 100%)}
.hero-track{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:calc(1 - var(--p)*2)}
.hero-track path.base{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1}
.hero-track path.lit{fill:none;stroke:url(#tg);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:.14 1;stroke-dashoffset:0}
.ix-ready .hero-track path.base{animation:draw 2.6s .3s var(--ease2) forwards}
.ix-ready .hero-track path.lit{animation:lap 7s 1.6s linear infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes lap{from{stroke-dashoffset:0}to{stroke-dashoffset:-1.14}}
.hero-back{position:absolute;z-index:1;border-radius:calc(28px*(1 - var(--p)));background:linear-gradient(135deg,var(--sky),var(--blue));opacity:calc(1 - var(--p)*3);top:calc(15svh - 16px + var(--p)*10svh);bottom:calc(38svh + 16px - var(--p)*10svh);left:calc(56vw + 18px);right:calc(5vw - 18px);transform:translateY(var(--sy,0))}
.hero-media{position:absolute;inset:0;z-index:2;clip-path:inset(calc(15svh*(1 - var(--p))) calc(5vw*(1 - var(--p))) calc(38svh*(1 - var(--p))) calc(56vw*(1 - var(--p))) round calc(28px*(1 - var(--p))))}
.hero-media img,.hero-media video{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 50%;transform:translate(calc((1 - var(--p))*16vw),calc((1 - var(--p))*-34svh)) scale(calc(1 + (1 - var(--p))*.4));transform-origin:55% 78%;filter:saturate(1.05)}

/* animacja zdjęcia toru */
.hero-media::before{content:"";position:absolute;inset:-10%;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:calc(1 - var(--p)*1.4);background:radial-gradient(circle at 30% 70%,rgba(26,166,232,.45),transparent 38%),radial-gradient(circle at 75% 35%,rgba(255,79,176,.35),transparent 34%);animation:neon 7s ease-in-out infinite alternate}
@keyframes neon{from{transform:translate3d(-6%,4%,0) scale(1)}to{transform:translate3d(8%,-5%,0) scale(1.25)}}
.hero-media::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-60%;width:36%;z-index:3;pointer-events:none;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);opacity:calc(1 - var(--p)*2);animation:sweep 5.5s 2.4s ease-in-out infinite}
@keyframes sweep{0%{left:-60%}45%,100%{left:140%}}
.ix-ready .hero-media{animation:mediaIn 1.6s .5s var(--ease) both}
@keyframes mediaIn{from{filter:blur(18px) brightness(1.7) saturate(1.6);opacity:.2}to{filter:none;opacity:1}}
.hero-back{box-shadow:0 0 0 0 rgba(26,166,232,.45);animation:ping 3.2s 2s ease-out infinite}
@keyframes ping{to{box-shadow:0 0 0 38px rgba(26,166,232,0)}}
@media (prefers-reduced-motion:reduce){.hero-media::before,.hero-media::after,.hero-back,.logo-burst .spin{animation:none!important}.logo-burst .pt{transform:rotate(var(--r)) scale(1)!important;animation:none!important}.lw span{opacity:1!important;transform:none!important;filter:none!important;animation:none!important}}
.hero-shade{position:absolute;inset:0;z-index:3;background:linear-gradient(180deg,rgba(6,48,74,.42),transparent 30%,transparent 50%,rgba(6,30,48,.78));opacity:calc((var(--p) - .35)*1.8);pointer-events:none}
.hero-copy{position:absolute;z-index:4;left:5vw;top:19svh;width:44vw;opacity:calc(1 - var(--p)*2.4);transform:translateY(calc(var(--p)*-50px));pointer-events:auto}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.3em;color:var(--blue);display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:34px;height:1px;background:currentColor}
.hero-lead{font-size:clamp(26px,3.3vw,52px);font-weight:200;line-height:1.08;letter-spacing:-.025em;margin:22px 0 34px;color:var(--navy)}
.hero-lead em{font-style:normal;font-weight:600;color:var(--blue)}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:12px;padding:16px 28px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.16em;position:relative;overflow:hidden;transition:transform .24s var(--ease),box-shadow .24s;transform:translate(var(--mx,0),var(--my,0));white-space:nowrap}
.btn span{position:relative}
.btn.dark{background:var(--navy);color:#fff}
.btn.dark::before{content:"";position:absolute;inset:0;background:var(--blue);transform:translateY(101%);transition:transform .35s var(--ease)}
.btn.line{border:1px solid var(--navy);color:var(--navy)}
.btn.line::before{content:"";position:absolute;inset:0;background:var(--navy);transform:translateY(101%);transition:transform .35s var(--ease)}
.btn.line:hover{color:#fff}.btn.line:hover::before{transform:none}
.btn.blue{background:#fff;color:var(--navy)}
.btn.blue::before{content:"";position:absolute;inset:0;background:var(--navy);transform:translateY(101%);transition:transform .35s var(--ease)}
.btn.blue:hover{color:#fff}.btn.blue:hover::before{transform:none}
.btn svg{width:14px;height:14px;position:relative;transition:transform .28s var(--ease)}

.hero-word{position:absolute;z-index:5;left:0;right:0;bottom:3.5svh;padding-inline:3.5vw;line-height:.8;white-space:nowrap;pointer-events:none;transform:translateY(calc(var(--p)*34svh));opacity:calc(1 - var(--p)*1.7)}
.hero-word .pre{display:block;font-size:clamp(14px,1.6vw,24px);font-weight:300;letter-spacing:.7em;color:var(--navy);margin:0 0 1.4vw 1.2vw;opacity:.75}
.hero-word .big{display:inline-block;font-weight:800;letter-spacing:-.045em;font-size:21vw;line-height:.8;color:transparent;background:url(assets/tor-duo.jpg) 50% calc(30% + var(--p)*40%)/cover no-repeat;-webkit-background-clip:text;background-clip:text;padding-bottom:.06em;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{background-size:130% auto}to{background-size:170% auto}}
.hero-end{position:absolute;z-index:6;left:5vw;right:5vw;bottom:6svh;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;color:#fff;opacity:calc((var(--p) - .62)*4);transform:translateY(calc((1 - var(--p))*40px));pointer-events:none}
.hero-end .cap{font-size:clamp(30px,5.4vw,84px);font-weight:200;line-height:.98;letter-spacing:-.035em}
.hero-end .cap b{display:block;font-weight:700}
.hero-end .stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.hero-end .stats span{padding:16px 22px;border-radius:18px;background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.28);font-size:12px;letter-spacing:.14em;font-weight:500;text-transform:uppercase;line-height:1.3}
.hero-end .stats b{display:block;font-size:26px;font-weight:300;letter-spacing:-.01em;text-transform:none}
.cue{position:absolute;z-index:6;left:5vw;bottom:4svh;display:flex;align-items:center;gap:12px;font-size:10px;font-weight:700;letter-spacing:.3em;color:var(--mut);opacity:calc(1 - var(--p)*6)}
.cue i{display:block;width:1px;height:46px;background:var(--line);position:relative;overflow:hidden}
.cue i::after{content:"";position:absolute;left:0;top:0;width:1px;height:16px;background:var(--blue);animation:cue 1.8s var(--ease2) infinite}
@keyframes cue{from{transform:translateY(-16px)}to{transform:translateY(46px)}}

/* wejście hero */
.ix-js .hero-copy>*,.ix-js .hero-word .pre{opacity:0;transform:translateY(34px);transition:opacity .65s var(--ease),transform .72s var(--ease)}
.ix-js.ix-ready .hero-copy>*,.ix-js.ix-ready .hero-word .pre{opacity:1;transform:none}
.ix-ready .hero-copy>*:nth-child(1){transition-delay:.55s}.ix-ready .hero-copy>*:nth-child(2){transition-delay:.7s}.ix-ready .hero-copy>*:nth-child(3){transition-delay:.85s}
.hero-word .big{--c:0}
.ix-js .hero-word .big{clip-path:inset(0 100% 0 0);transition:clip-path .86s .45s var(--ease2)}
.ix-js.ix-ready .hero-word .big{clip-path:inset(-10% -2% -10% -2%)}
.ix-js .hero-media{transition:none}
.ix-js .hero-back{transition:opacity .72s .3s}

/* ---------- wspólne sekcje ---------- */
.sec{position:relative;padding:clamp(90px,13vw,180px) 0}
.tag{display:flex;align-items:center;gap:16px;font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--blue);margin-bottom:34px}
.tag::after{content:"";height:1px;width:0;background:var(--line);flex:0 1 160px;transition:width .79s var(--ease)}
.in .tag::after,.tag.in::after{width:160px}
h2.hd2{font-weight:200;font-size:clamp(40px,5.6vw,98px);line-height:.96;letter-spacing:-.04em;color:var(--navy)}
h2.hd2 span{color:inherit;font-weight:inherit}
.ln{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
.ln>span{display:block!important;transform:translateY(112%);transition:transform .72s var(--ease);transition-delay:calc(var(--n,0)*.12s);font-weight:inherit;color:inherit}
.ln.l2>span{color:var(--blue);font-weight:300}
.go .ln>span,.ln.go>span{transform:none}
.rv{opacity:0;transform:translateY(40px);transition:opacity .65s var(--ease),transform .69s var(--ease);transition-delay:calc(var(--i,0)*.09s)}
.rv.go{opacity:1;transform:none}
html:not(.ix-js) .rv{opacity:1;transform:none}html:not(.ix-js) .ln>span{transform:none}
.clipimg{clip-path:inset(12% 12% 12% 12% round 24px);transition:clip-path .82s var(--ease)}
.clipimg.go{clip-path:inset(0 0 0 0 round 24px)}
html:not(.ix-js) .clipimg{clip-path:none}
.lead{color:var(--mut);font-size:17px;max-width:46ch}

/* 01 TOR */
.intro{background:#fff}
.intro-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(30px,6vw,110px);align-items:start}
.copy p{font-size:clamp(19px,1.7vw,25px);font-weight:300;line-height:1.5;letter-spacing:-.01em}
.copy p+p{margin-top:1.1em}
.copy .w{color:#bcd2de;transition:color .35s}
.copy .w.on{color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:clamp(60px,8vw,120px);border-top:1px solid var(--line)}
.facts article{padding:36px 24px 10px 0;position:relative}
.facts article+article{padding-left:28px;border-left:1px solid var(--line)}
.facts b{display:block;white-space:nowrap;font-size:clamp(30px,3.1vw,54px);font-weight:200;letter-spacing:-.04em;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
.facts span{display:block;margin-top:14px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:500}

.band{position:relative;padding-bottom:0}
.band-img{position:relative;height:clamp(300px,52vw,720px);overflow:hidden;border-radius:28px;width:min(1400px,94vw);margin-inline:auto;background:var(--ice)}
.band-img img.big{position:absolute;left:0;top:-12%;width:100%;height:124%;object-fit:cover;transform:translate3d(0,calc(var(--bp,0)*-7%),0)}
.band-img .small{position:absolute;right:4%;bottom:7%;width:clamp(120px,19vw,260px);border-radius:16px;border:5px solid #fff;box-shadow:0 20px 50px -14px rgba(6,48,74,.5);overflow:hidden;transform:translateY(calc(var(--bp,0)*60px))}
.band-img .small img{width:100%;aspect-ratio:3/2;object-fit:cover}
.mq{overflow:hidden;white-space:nowrap;padding:34px 0 0}
.mq-t{display:inline-flex;gap:60px;animation:mq 38s linear infinite;padding-right:60px}
.mq-t span{font-size:clamp(46px,8vw,128px);font-weight:200;letter-spacing:-.03em;color:transparent;-webkit-text-stroke:1px var(--sky);line-height:1}
.mq-t span:nth-child(even){-webkit-text-stroke:0;color:var(--ice)}
.mq.rev .mq-t{animation-direction:reverse}
@keyframes mq{to{transform:translateX(-50%)}}

/* 02 CENNIK */
.pricing{background:linear-gradient(180deg,#fff,var(--mist) 60%,#fff)}
.sh{display:grid;grid-template-columns:1fr .7fr;gap:40px;align-items:end;margin-bottom:clamp(50px,6vw,90px)}
.sh>p{color:var(--mut);font-size:18px;font-weight:300;max-width:34ch;justify-self:end}
.sh strong{color:var(--navy);font-weight:700}
.rows{border-bottom:1px solid var(--line)}
.row{position:relative;display:grid;grid-template-columns:70px 1.1fr 1fr 1fr 150px;align-items:center;gap:20px;padding:clamp(26px,3vw,44px) 14px;border-top:1px solid var(--line);isolation:isolate;cursor:default}
.row::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--ice),rgba(158,220,251,.35) 70%,transparent);transform:scaleX(0);transform-origin:0 50%;transition:transform .53s var(--ease)}
.row .n{font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--blue)}
.row h3{font-size:clamp(28px,3.8vw,60px);font-weight:200;letter-spacing:-.035em;line-height:1;color:var(--navy);transition:transform .47s var(--ease),font-weight .21s}
.row .d{color:var(--mut);font-size:16px;font-weight:300;line-height:1.3}
.row .d em{display:block;font-style:normal;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--blue);margin-top:6px}
.row .d small{display:block;font-size:13px;font-weight:300;margin-top:6px;color:#8fa6b5;max-width:30ch}
.pr strong{font-size:clamp(40px,4.4vw,70px);font-weight:200;letter-spacing:-.04em;line-height:1;color:var(--navy)}
.pr strong small{font-size:14px;font-weight:600;letter-spacing:.16em;margin-left:6px;color:var(--blue)}
.pl{display:block;margin-top:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.nx{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);text-align:right}
.nx b{display:block;font-size:20px;font-weight:600;letter-spacing:0;color:var(--navy);margin-top:4px}
.row .th{display:none}
.peek{position:fixed;left:0;top:0;width:320px;height:210px;z-index:60;pointer-events:none;border-radius:20px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(6,48,74,.55);opacity:0;transition:opacity .24s;will-change:transform}
.peek.on{opacity:1}
.peek img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.2);transition:opacity .35s,transform .65s var(--ease)}
.peek img.on{opacity:1;transform:none}
.gp{margin-top:clamp(40px,5vw,70px);border-radius:32px;padding:clamp(30px,4vw,60px);background:linear-gradient(120deg,var(--navy) 0%,#0a4f78 55%,var(--deep) 100%);color:#fff;position:relative;overflow:hidden;display:grid;grid-template-columns:1.4fr auto;gap:clamp(24px,4vw,60px);align-items:center}
.gp::after{content:"";position:absolute;right:-6%;top:-40%;width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(158,220,251,.35),transparent 65%);pointer-events:none}
.gp .k{font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--sky)}
.gp h3{font-weight:200;font-size:clamp(28px,3.6vw,54px);letter-spacing:-.03em;line-height:1.04;margin:14px 0 30px}
.gp h3 b{font-weight:700}
.tl{display:flex;gap:6px;height:44px;position:relative;max-width:640px}
.tl div{position:relative;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.1);display:flex;align-items:center;padding:0 16px;font-size:11px;font-weight:700;letter-spacing:.16em}
.tl div::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(158,220,251,.7),rgba(26,166,232,.9));transform:scaleX(0);transform-origin:0 50%;transition:transform .93s var(--ease2)}
.tl div:nth-child(2)::before{transition-delay:1.1s;background:linear-gradient(90deg,#fff,var(--sky))}
.tl div:nth-child(2){color:var(--navy)}
.tl div span{position:relative;white-space:nowrap}
.go .tl div::before,.tl.go div::before{transform:none}
.gp .buy{position:relative;z-index:1;text-align:right}
.gp .buy strong{display:block;font-size:clamp(64px,8vw,130px);font-weight:200;letter-spacing:-.05em;line-height:.9}
.gp .buy strong small{font-size:16px;letter-spacing:.2em;font-weight:600;color:var(--sky);margin-left:8px}
.gp .buy .btn{margin-top:26px}

/* 03 GOKARTY */
.karts{background:#fff}
.acc{display:flex;gap:14px;height:clamp(420px,46vw,620px)}
.pn{position:relative;flex:1 1 0;min-width:0;border-radius:26px;overflow:hidden;cursor:pointer;background:var(--navy);transition:flex-grow .59s var(--ease)}
.pn.on{flex-grow:2.6}
.pn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.12);transition:transform .79s var(--ease),filter .53s;filter:grayscale(1) contrast(1.05) brightness(1.02)}
.pn::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(26,166,232,.55),rgba(6,48,74,.85));mix-blend-mode:multiply;transition:opacity .53s}
.pn::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 35%,rgba(6,30,48,.82));pointer-events:none}
.pn.on img{transform:scale(1);filter:none}
.pn.on::before{opacity:0}
.pn-t{position:absolute;z-index:2;left:clamp(18px,2.2vw,34px);right:clamp(18px,2.2vw,34px);bottom:clamp(20px,2.4vw,34px);color:#fff}
.pn-t .nn{font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--sky)}
.pn-t h3{font-weight:200;font-size:clamp(26px,3.4vw,54px);letter-spacing:-.035em;line-height:1;margin:10px 0 0;white-space:nowrap}
.pn-t p{font-size:16px;font-weight:300;max-width:30ch;max-height:0;opacity:0;overflow:hidden;transition:max-height .53s var(--ease),opacity .41s,margin .53s var(--ease)}
.pn.on .pn-t p{max-height:80px;opacity:1;margin-top:12px;transition-delay:.15s}
.safety{margin-top:20px;display:flex;align-items:center;gap:22px;padding:22px 28px;border-radius:20px;background:var(--ice);border:1px solid var(--line)}
.safety i{flex:0 0 12px;height:12px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 0 rgba(26,166,232,.5);animation:ping 2.4s infinite}
@keyframes ping{70%{box-shadow:0 0 0 14px rgba(26,166,232,0)}100%{box-shadow:0 0 0 0 rgba(26,166,232,0)}}
.safety b{font-size:11px;letter-spacing:.3em;color:var(--blue);font-weight:700;white-space:nowrap}
.safety span{font-size:16px;font-weight:300;color:var(--navy)}

/* 04 GRUPY */
.groups{background:var(--mist)}
.groups-wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(30px,6vw,100px);align-items:center}
.groups-wrap .photo{position:relative;aspect-ratio:4/5;max-height:640px}
.groups-wrap .photo>div{position:absolute;inset:0;overflow:hidden;border-radius:24px}
.groups-wrap .photo img{width:100%;height:118%;object-fit:cover;transform:translateY(calc(var(--bp,0)*-6%))}
.groups-wrap .photo::after{content:"";position:absolute;z-index:-1;left:-5%;bottom:-5%;width:55%;height:55%;border-radius:24px;background:linear-gradient(135deg,var(--sky),var(--ice))}
.groups .copy p{color:var(--mut);margin:34px 0 28px;font-size:18px}
.groups ul{border-top:1px solid var(--line);margin-bottom:38px}
.groups li{display:flex;justify-content:space-between;align-items:center;padding:18px 4px;border-bottom:1px solid var(--line);font-size:20px;font-weight:300;color:var(--navy);transition:padding .41s var(--ease),color .21s}
.groups li::after{content:"→";color:var(--blue);opacity:0;transform:translateX(-12px);transition:.35s var(--ease)}
.groups li:hover{padding-left:18px}.groups li:hover::after{opacity:1;transform:none}

/* 05 ZAWODY */
.racing{background:linear-gradient(180deg,#fff,var(--ice) 45%,var(--sky) 160%);overflow:hidden}
.racing .mq{position:absolute;left:0;right:0;top:9%;padding:0;opacity:.55;pointer-events:none}
.race-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,100px);align-items:end}
.race-copy p{font-size:19px;font-weight:300;color:var(--navy);max-width:40ch}
.race-box{margin:34px 0;padding:26px 30px;border-radius:22px;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #fff;position:relative;overflow:hidden}
.race-box::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--sky))}
.race-box b{display:block;font-size:12px;letter-spacing:.24em;color:var(--blue);font-weight:700;margin-bottom:6px}
.race-box span{font-size:17px;font-weight:300}
.chk{height:26px;margin-top:70px;background:repeating-conic-gradient(var(--navy) 0 25%,#fff 0 50%) 0 0/26px 26px;border-radius:6px;opacity:.9;mask-image:linear-gradient(90deg,#000,transparent);-webkit-mask-image:linear-gradient(90deg,#000,transparent);position:relative}

/* 06 GALERIA */
.gallery{background:#fff;padding-bottom:clamp(60px,8vw,120px)}
.gg{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:clamp(80px,9vw,140px);gap:14px}
.gg figure{position:relative;overflow:hidden;border-radius:22px;background:var(--ice)}
.gg figure img{width:100%;height:100%;object-fit:cover;transition:transform .86s var(--ease)}
.gg figure:nth-child(1){grid-column:1/8;grid-row:span 4}
.gg figure:nth-child(2){grid-column:8/13;grid-row:span 2}
.gg figure:nth-child(3){grid-column:8/13;grid-row:span 2}
.gg figure:nth-child(4){grid-column:1/5;grid-row:span 3}
.gg figure:nth-child(5){grid-column:5/9;grid-row:span 3}
.gg figure:nth-child(6){grid-column:9/13;grid-row:span 3}

/* KONTAKT */
.contact{background:linear-gradient(180deg,#fff,var(--ice));padding:clamp(100px,14vw,200px) 0 60px;position:relative;overflow:hidden}
.contact h2.hd2{margin-bottom:clamp(40px,6vw,80px)}
.tel{position:relative;display:inline-block;font-size:clamp(40px,10vw,170px);font-weight:200;letter-spacing:-.05em;line-height:1;color:var(--navy);white-space:nowrap;padding-bottom:.08em}
.tel::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:linear-gradient(90deg,var(--blue),var(--sky));transform:scaleX(0);transform-origin:0 50%;transition:transform .65s var(--ease)}
.tel:hover{color:var(--blue)}
.cdata{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:clamp(30px,6vw,100px);margin-top:clamp(40px,5vw,70px);align-items:start}
.cdata h4{font-size:11px;letter-spacing:.3em;color:var(--blue);font-weight:700;margin-bottom:12px}
.cdata p{font-size:19px;font-weight:300;line-height:1.55}
.cmap{position:relative;margin-top:clamp(40px,5vw,70px);border-radius:28px;overflow:hidden;background:var(--ice);aspect-ratio:21/8;min-height:300px;box-shadow:0 30px 70px -40px rgba(6,48,74,.45);border:1px solid var(--line)}
.cmap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;filter:saturate(.85) hue-rotate(-6deg)}
.cmap .btn{position:absolute;right:20px;bottom:20px;z-index:2}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:clamp(60px,9vw,130px);padding-top:26px;border-top:1px solid var(--line);font-size:11px;letter-spacing:.24em;color:var(--mut);font-weight:600}

/* ---------- mobile / tablet ---------- */
@media (max-width:1000px){
  .nav,.rail,.hd .cta{display:none}
  .burger{display:block}
  .hd{padding:8px 8px 8px 22px}
  .intro-grid,.groups-wrap,.race-grid,.sh{grid-template-columns:1fr}
  .sh>p{justify-self:start}
  .facts{grid-template-columns:1fr 1fr}
  .facts article:nth-child(3){padding-left:0;border-left:0}
  .facts article:nth-child(n+3){border-top:1px solid var(--line);margin-top:20px}
  .row{grid-template-columns:44px 1fr auto;gap:10px 14px;padding:26px 6px}
  .row .d{grid-column:2/3;grid-row:2}
  .row .pr{grid-column:3;grid-row:1/3;text-align:right}
  .row .nx{grid-column:2/4;grid-row:3;text-align:left;display:flex;gap:10px;align-items:baseline}
  .row .nx b{display:inline;font-size:16px;margin:0}
  .row .th{display:block;grid-column:1/4;grid-row:4;margin-top:14px;border-radius:16px;overflow:hidden;aspect-ratio:16/9}
  .row .th img{width:100%;height:100%;object-fit:cover}
  .row:hover h3{transform:none}
  .peek{display:none}
  .gp{grid-template-columns:1fr}.gp .buy{text-align:left}
  .acc{flex-direction:column;height:auto}
  .pn{flex:none;height:110px;transition:height .59s var(--ease)}
  .pn.on{height:clamp(300px,70vw,420px)}
  .pn-t h3{font-size:30px}
  .gg{grid-template-columns:repeat(6,1fr);grid-auto-rows:clamp(70px,16vw,120px)}
  .gg figure:nth-child(1){grid-column:1/7;grid-row:span 3}
  .gg figure:nth-child(2){grid-column:1/4;grid-row:span 2}
  .gg figure:nth-child(3){grid-column:4/7;grid-row:span 2}
  .gg figure:nth-child(4){grid-column:1/7;grid-row:span 2}
  .gg figure:nth-child(5){grid-column:1/4;grid-row:span 2}
  .gg figure:nth-child(6){grid-column:4/7;grid-row:span 2}
  .cdata{grid-template-columns:1fr}
  .safety{flex-direction:column;align-items:flex-start;gap:12px}
  /* hero na telefonie */
  .hero{height:230svh}
  .hero-media{clip-path:inset(calc(13svh*(1 - var(--p))) calc(5vw*(1 - var(--p))) calc(50svh*(1 - var(--p))) calc(5vw*(1 - var(--p))) round calc(24px*(1 - var(--p))))}
  .hero-back{top:calc(13svh - 12px + var(--p)*8svh);bottom:calc(50svh + 12px - var(--p)*8svh);left:calc(5vw + 14px);right:calc(5vw - 14px)}
  .hero-copy{top:auto;bottom:6svh;width:90vw}
  .hero-lead{font-size:clamp(22px,6.4vw,32px);margin:14px 0 20px}
  .hero-word{bottom:auto;top:calc(50svh + 14px)}
  .hero-word .pre{font-size:11px;margin:0 0 6px 6px}
  .hero-word .big{font-size:22vw}
  .hero-word{opacity:1;transform:translateY(calc(var(--p)*-9svh))}
  .hero-word .big{filter:drop-shadow(0 3px 14px rgba(6,48,74,.45));-webkit-text-stroke:calc(var(--p)*1.6px) rgba(255,255,255,.95)}
  .hero-end{flex-direction:column;align-items:flex-start;bottom:5svh}
  .hero-end .stats{justify-content:flex-start;gap:8px}
  .hero-end .stats span{padding:12px 14px;font-size:10px}
  .hero-end .stats b{font-size:20px}
  .cue{display:none}
  .btn{padding:14px 22px}
}
@media (max-width:560px){
  .facts b{font-size:40px}
  .row h3{font-size:26px}
  .pr strong{font-size:38px}
  .tl{height:40px}.tl div{padding:0 10px;font-size:9px;letter-spacing:.1em}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:s!important}
  html{scroll-behavior:auto}
  .rv,.ln>span,.clipimg{opacity:1!important;transform:none!important;clip-path:none!important}
  .curtain{display:none!important}
}

/* film */
.hero-media video{filter:saturate(1.12) contrast(1.06);object-position:50% 50%;transform:translate(calc((1 - var(--p))*5vw),calc((1 - var(--p))*-6svh)) scale(calc(1.02 + (1 - var(--p))*.1));transform-origin:55% 60%}
.flb{position:fixed;inset:0;z-index:99990;background:rgba(3,14,26,.94);display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .28s,visibility .28s;padding:16px}
.flb.on{opacity:1;visibility:visible}
.flb video{width:min(1200px,100%);max-height:84vh;border-radius:16px;background:#000;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 1px rgba(26,166,232,.4)}
.flb button{position:absolute;top:16px;right:16px;width:48px;height:48px;border-radius:50%;border:0;background:#fff;font-size:22px;cursor:pointer}
button.btn{font-family:inherit;cursor:pointer}

/* ===== wyniki ===== */
.rs-hero{position:relative;padding:clamp(130px,15vw,190px) 0 clamp(30px,4vw,60px);background:linear-gradient(180deg,#fff,var(--mist));overflow:hidden}
.rs-hero::before{content:"";position:absolute;right:-12vw;top:-18vw;width:46vw;height:46vw;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(26,166,232,.28),rgba(158,220,251,.12) 55%,transparent 70%);animation:rsf 9s ease-in-out infinite alternate}
@keyframes rsf{to{transform:translate(-4vw,3vw) scale(1.12)}}
.rs-hero h1{font-weight:200;font-size:clamp(46px,8.4vw,150px);line-height:.92;letter-spacing:-.045em;color:var(--navy);margin:26px 0 28px}
.rs-hero h1 span{color:var(--blue);font-weight:300}
.rs-in{opacity:0;transform:translateY(30px);animation:rsin 1s var(--ease) forwards;animation-delay:calc(var(--d,0)*.12s + .5s)}
@keyframes rsin{to{opacity:1;transform:none}}
.rs-meta{display:flex;gap:10px 28px;flex-wrap:wrap;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:600}
.rs-meta b{color:var(--navy);font-weight:700}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}
.tabs button{font:600 12px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;padding:15px 22px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;position:relative;overflow:hidden;transition:color .21s,border-color .21s,transform .28s var(--ease)}
.tabs button::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,var(--deep),var(--blue));transform:translateY(101%);transition:transform .32s var(--ease);z-index:0}
.tabs button span{position:relative;z-index:1}
.tabs button.on{color:#fff;border-color:transparent}.tabs button.on::before{transform:none}
.demo{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.2em;padding:6px 12px;border-radius:999px;background:#fff3cf;color:#9a6a00;border:1px dashed #e0b84a;margin-left:14px;vertical-align:middle}
.rs-main{padding:clamp(40px,6vw,90px) 0 clamp(80px,10vw,140px);background:linear-gradient(180deg,var(--mist),#fff 40%)}
.pod{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:clamp(12px,2vw,28px);align-items:end}
.pd{position:relative;border-radius:28px;padding:30px 28px 28px;background:#fff;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;transform:translateY(60px);transition:opacity .59s var(--ease),transform .69s var(--ease);transition-delay:calc(var(--o)*.14s);min-height:var(--h)}
.pod.go .pd{opacity:1;transform:none}
.pd .pl{position:absolute;right:18px;top:-10px;font-weight:200;font-size:clamp(120px,15vw,240px);line-height:1;letter-spacing:-.06em;color:var(--ice);pointer-events:none}
.pd .nm{position:relative;font-size:clamp(20px,2.1vw,32px);font-weight:400;letter-spacing:-.02em;color:var(--navy);line-height:1.1}
.pd .pt{position:relative;margin-top:14px;font-weight:200;font-size:clamp(44px,5vw,84px);line-height:1;letter-spacing:-.04em;color:var(--navy);font-variant-numeric:tabular-nums}
.pd .pt small{font-size:.28em;letter-spacing:.2em;font-weight:600;color:var(--mut);margin-left:8px}
.pd .ex{position:relative;margin-top:10px;font-size:12px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
.pd.p1{background:linear-gradient(160deg,var(--navy),var(--deep) 70%,#1186c4);color:#fff;border:0;box-shadow:0 40px 80px -30px rgba(26,166,232,.6)}
.pd.p1 .pl{color:rgba(158,220,251,.16)}.pd.p1 .nm,.pd.p1 .pt{color:#fff}.pd.p1 .pt small,.pd.p1 .ex{color:#9edcfb}
.pd.p1::after{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:repeating-conic-gradient(#fff 0 25%,transparent 0 50%) 0 0/14px 14px;opacity:.9}
.pd.p1::before{content:"";position:absolute;top:-30%;bottom:-30%;left:-60%;width:36%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:sweep 5.5s 1.6s ease-in-out infinite}
.lst{margin-top:clamp(40px,6vw,80px)}
.lh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.lh h2{font-weight:200;font-size:clamp(30px,3.6vw,56px);letter-spacing:-.04em;color:var(--navy);line-height:1}
.srch{position:relative}
.srch input{font:400 15px var(--f);padding:15px 22px 15px 46px;border-radius:999px;border:1px solid var(--line);background:#fff;width:min(320px,80vw);color:var(--ink);transition:border-color .21s,box-shadow .21s}
.srch input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(26,166,232,.15)}
.srch::before{content:"";position:absolute;left:20px;top:50%;width:11px;height:11px;border:1.5px solid var(--mut);border-radius:50%;transform:translateY(-62%)}
.srch::after{content:"";position:absolute;left:30px;top:calc(50% + 4px);width:6px;height:1.5px;background:var(--mut);transform:rotate(45deg)}
.hdr,.rw{display:grid;grid-template-columns:78px minmax(160px,1.3fr) minmax(120px,2fr) 120px var(--ex,0px);align-items:center;gap:0 18px}
.hdr{padding:12px 22px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);font-weight:600;border-bottom:1px solid var(--navy)}
.hdr .r,.rw .pp{text-align:right}
.rw{padding:20px 22px;border-bottom:1px solid var(--line);border-radius:0;position:relative;transition:background .21s,transform .35s var(--ease);opacity:0;transform:translateY(24px);animation:rsin .8s var(--ease) forwards;animation-delay:calc(var(--i)*40ms + .1s)}
.rw .n{font-weight:200;font-size:clamp(28px,3vw,44px);letter-spacing:-.04em;color:var(--mut);font-variant-numeric:tabular-nums;line-height:1}
.rw.t1 .n,.rw.t2 .n,.rw.t3 .n{background:linear-gradient(135deg,var(--deep),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:300}
.rw .nm{font-size:clamp(17px,1.5vw,22px);color:var(--navy);font-weight:400;letter-spacing:-.01em}
.rw .br{height:6px;border-radius:6px;background:var(--ice);overflow:hidden}
.rw .br i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--deep),var(--blue),var(--sky));transform-origin:0 50%;transform:scaleX(0);transition:transform .79s var(--ease);transition-delay:calc(var(--i)*40ms + .5s)}
.go .rw .br i{transform:scaleX(var(--w))}
.rw .pp{font-weight:300;font-size:clamp(20px,2vw,30px);color:var(--navy);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rw .xx{font-size:14px;color:var(--mut);letter-spacing:.04em;text-align:right;font-variant-numeric:tabular-nums}
.xcol{display:grid;gap:0 18px;grid-auto-flow:column;grid-auto-columns:minmax(90px,1fr);justify-self:end}
.empty{padding:60px 20px;text-align:center;color:var(--mut)}

.ch2{margin-top:50px}
@media (max-width:900px){
  .pod{grid-template-columns:1fr;align-items:stretch}.pd{min-height:0!important;order:var(--m)}.pd .pl{font-size:140px}
  .hdr,.rw{grid-template-columns:50px 1fr auto}.hdr .b,.rw .br,.hdr .x,.rw .xcol{display:none}
}

.lg{margin:0 0 14px;font-size:12px;letter-spacing:.1em;color:var(--mut)}
.mx .hdr,.mx .rw{grid-template-columns:54px minmax(150px,1.1fr) 84px minmax(0,3.2fr);gap:0 14px}
.mx .br,.mx .hdr .b{display:none}

.mx .hdr .xcol span{text-align:center!important}
.mx .xx{text-align:center;font-size:13px;padding:8px 0;border-radius:8px;background:rgba(26,166,232,calc(var(--h,0)*.28));color:var(--navy);font-weight:500}
.mx .xx.z{background:none;color:#c3d3de}
.mx .xx.dr{color:#9fb4c2;text-decoration:line-through;background:none;font-weight:300;opacity:.8}
.mx .xx.tt{background:none;font-weight:700;color:var(--deep)}
.mx .rw .pp{font-weight:600;color:var(--navy);font-size:clamp(20px,1.9vw,28px)}
@media (max-width:900px){
  .mx .hdr,.mx .rw{grid-template-columns:44px 1fr auto;gap:0 12px}
  .mx .hdr .xcol,.mx .rw .xcol{display:none}
  .mx .rw{cursor:pointer;flex-wrap:wrap}
  .mx .rw.open .xcol{display:grid;grid-column:1/-1;grid-auto-flow:row;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
  .mx .rw.open .xx::before{content:attr(data-l);display:block;font-size:9px;letter-spacing:.14em;color:var(--mut);margin-bottom:2px;text-decoration:none}
  .mx .rw::after{content:"+";position:absolute;right:6px;top:8px;font-size:12px;color:var(--mut);display:none}
}
@media (prefers-reduced-motion:reduce){.rs-in,.rw,.pd{animation:none!important;opacity:1!important;transform:none!important;transition:none!important}.rw .br i{transition:none}.go .rw .br i{transform:scaleX(var(--w))}}

@media (hover:hover) and (pointer:fine){

}

<script>
(function(){
'use strict';
var d=document,root=d.documentElement,reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function $(s,r){return(r||d).querySelector(s)}function $$(s,r){return[].slice.call((r||d).querySelectorAll(s))}
/* kurtyna + nawigacja */
var ready=false;function lift(){if(ready)return;ready=true;root.classList.add('ix-ready')}
Promise.all([new Promise(function(r){setTimeout(r,reduce?0:800)}),new Promise(function(r){if(d.readyState==='complete')r();else addEventListener('load',r)})]).then(lift);setTimeout(lift,3500);
addEventListener('pageshow',function(e){if(e.persisted)$('.curtain').classList.remove('out')});
var ind=$('#ind'),navA=$$('#nav a'),cur=$('#nav a.cur');
function moveInd(a){if(!a){ind.style.opacity=0;return}ind.style.opacity=1;ind.style.left=a.offsetLeft+'px';ind.style.width=a.offsetWidth+'px'}

var hd=$('#hd'),bar=$('#bar'),lastY=0;
addEventListener('scroll',function(){var y=scrollY,vh=innerHeight;if(y>vh*.5&&y>lastY+4)hd.classList.add('hide');else if(y<lastY-4||y<vh*.5)hd.classList.remove('hide');lastY=y;bar.style.setProperty('--pg',(y/Math.max(1,d.documentElement.scrollHeight-vh)).toFixed(4))},{passive:true});
var burger=$('#burger');function menu(o){root.classList.toggle('menu-open',o);d.body.classList.toggle('menu-open',o);burger.setAttribute('aria-expanded',o);d.body.style.overflow=o?'hidden':''}
burger.addEventListener('click',function(){menu(!d.body.classList.contains('menu-open'))});
d.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button!==0)return;var h=a.getAttribute('href')||'';if(!h||h.charAt(0)==='#'||/^(tel:|mailto:|javascript:)/i.test(h)||a.target==='_blank'||reduce)return;var u;try{u=new URL(a.href,location.href)}catch(_){return}if(u.origin!==location.origin||u.pathname===location.pathname)return;e.preventDefault();$('.curtain').classList.add('out');setTimeout(function(){location.href=a.href},650)});

/* ===== czytnik XLSX (bez bibliotek) ===== */
function u16(b,o){return b[o]|b[o+1]<<8}function u32(b,o){return(b[o]|b[o+1]<<8|b[o+2]<<16|b[o+3]<<24)>>>0}
function inflate(data){var ds=new DecompressionStream('deflate-raw');var w=ds.writable.getWriter();w.write(data);w.close();return new Response(ds.readable).arrayBuffer().then(function(x){return new Uint8Array(x)})}
function unzip(buf){var b=new Uint8Array(buf),i=b.length-22;while(i>=0&&u32(b,i)!==0x06054b50)i--;if(i<0)throw new Error('To nie jest plik xlsx');
  var n=u16(b,i+10),o=u32(b,i+16),files={},dec=new TextDecoder(),jobs=[];
  for(var k=0;k<n;k++){var m=u16(b,o+10),cs=u32(b,o+20),nl=u16(b,o+28),el=u16(b,o+30),cl=u16(b,o+32),lo=u32(b,o+42),name=dec.decode(b.subarray(o+46,o+46+nl));o+=46+nl+el+cl;
    (function(name,m,cs,lo){var ln=u16(b,lo+26),le=u16(b,lo+28),st=lo+30+ln+le,raw=b.subarray(st,st+cs);
      jobs.push((m===0?Promise.resolve(raw):inflate(raw)).then(function(x){files[name]=dec.decode(x)}))})(name,m,cs,lo)}
  return Promise.all(jobs).then(function(){return files})}
function xml(s){return new DOMParser().parseFromString(s,'application/xml')}
function colIdx(ref){var m=/^([A-Z]+)/.exec(ref)[1],n=0;for(var i=0;i<m.length;i++)n=n*26+m.charCodeAt(i)-64;return n-1}
function readWB(buf){return unzip(buf).then(function(f){
  var ss=[];if(f['xl/sharedStrings.xml'])$$('si',xml(f['xl/sharedStrings.xml'])).forEach(function(si){ss.push($$('t',si).map(function(t){return t.textContent}).join(''))});
  var rels={};$$('Relationship',xml(f['xl/_rels/workbook.xml.rels'])).forEach(function(r){rels[r.getAttribute('Id')]=r.getAttribute('Target')});
  var out=[];$$('sheet',xml(f['xl/workbook.xml'])).forEach(function(sh){
    var t=rels[sh.getAttribute('r:id')]||rels[sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')];if(!t)return;t=t.replace(/^\//,'');var p=t.indexOf('xl/')===0?t:'xl/'+t;if(!f[p])return;
    var rows=[];$$('row',xml(f[p])).forEach(function(r){var row=[];$$('c',r).forEach(function(c){var ci=colIdx(c.getAttribute('r')),ty=c.getAttribute('t'),v=c.querySelector('v'),val='';
      if(ty==='s')val=ss[+v.textContent]||'';else if(ty==='inlineStr')val=$$('t',c).map(function(t){return t.textContent}).join('');else if(v){val=ty==='str'||ty==='b'||ty==='e'?v.textContent:(+v.textContent)}
      row[ci]=val});rows.push(row)});
    out.push({name:sh.getAttribute('name'),rows:rows})});
  return out})}

/* ===== model wyników ===== */
function low(s){return String(s==null?'':s).toLowerCase()}
function toNum(v){if(typeof v==='number')return v;var n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?null:n}
function parse(sh){var rows=sh.rows,hi=-1,ci={};
  for(var r=0;r<Math.min(rows.length,12)&&hi<0;r++){var row=rows[r]||[];row.forEach(function(c,i){var l=low(c);if(/zawodnik|kierowc|imi|nazw|uczestnik|^liga$/.test(l))ci.name=ci.name==null?i:ci.name;if(/punkt|pkt|total\s*\(/.test(l))ci.pts=ci.pts==null?i:ci.pts;if(/miejsc|pozyc|^lp|^#/.test(l))ci.place=ci.place==null?i:ci.place});if(ci.name!=null&&ci.pts!=null)hi=r;else ci={}}
  if(hi<0)return null;var head=rows[hi],ex=[];head.forEach(function(h,i){if(h!==''&&h!=null&&i!==ci.name&&i!==ci.pts&&i!==ci.place&&low(h)!==low(head[ci.pts]))ex.push(i)});
  var list=[];for(var r2=hi+1;r2<rows.length;r2++){var row2=rows[r2]||[],nm=row2[ci.name];if(nm===''||nm==null)continue;var p=toNum(row2[ci.pts]);if(p==null)p=0;
    list.push({name:String(nm).trim(),pts:p,place:ci.place!=null?toNum(row2[ci.place]):null,ex:ex.map(function(i){var v=row2[i];return v==null?'':v})})}
  var hasPlace=ci.place!=null&&list.every(function(x){return x.place!=null});
  if(hasPlace)list.sort(function(a,b){return a.place-b.place||b.pts-a.pts});else{list.sort(function(a,b){return b.pts-a.pts});var pl=0,lp=null;list.forEach(function(x,i){if(x.pts!==lp){pl=i+1;lp=x.pts}x.place=pl})}
  var dm=/\(-(\d+)\)/.exec(String(head[ci.pts]));return{name:sh.name,list:list,heads:ex.map(function(i){return String(head[i])}),drop:dm?+dm[1]:0}}
function fmt(n){return n%1?n.toLocaleString('pl-PL',{maximumFractionDigits:2}):String(n)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function lbl(h){return /^\d+$/.test(h)?'R'+h:/^total$/i.test(h)?'Suma':h}
function clean(n){return n.replace(/\s*\(przykład\)\s*/i,'').trim()}

var app=$('#app'),tabsEl=$('#tabs'),metaEl=$('#meta'),events=[],active=0,upd='';
function countUp(el){var to=+el.dataset.to,t0=performance.now(),dur=1400;if(reduce||!to){el.textContent=fmt(to);return}function f(t){var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);el.textContent=fmt(Math.round(to*e*100)/100);if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function render(){var ev=events[active],L=ev.list,max=Math.max.apply(null,L.map(function(x){return x.pts}).concat([1])),demo=/przykład/i.test(ev.name);
  tabsEl.innerHTML=events.length>1?events.map(function(e,i){return'<button type="button" role="tab" aria-selected="'+(i===active)+'" class="'+(i===active?'on':'')+'" data-i="'+i+'"><span>'+esc(clean(e.name))+'</span></button>'}).join(''):'';
  metaEl.innerHTML='<span>Zawody: <b>'+esc(clean(ev.name))+'</b></span><span>Zawodników: <b>'+L.length+'</b></span>'+(L.length?'<span>Najwięcej punktów: <b>'+fmt(max)+'</b></span>':'')+(upd?'<span>Aktualizacja: <b>'+upd+'</b></span>':'')+(demo?'<span class="demo">DANE PRZYKŁADOWE</span>':'');
  var top=L.slice(0,3),podHTML='';
  if(top.length){var cfg=[{i:1,c:'p2',h:'clamp(240px,24vw,330px)',m:2},{i:0,c:'p1',h:'clamp(290px,29vw,390px)',m:1},{i:2,c:'p3',h:'clamp(210px,21vw,290px)',m:3}];
    podHTML='<div class="pod" id="pod">'+cfg.filter(function(c){return top[c.i]}).map(function(c,k){var x=top[c.i];return'<article class="pd '+c.c+'" style="--h:'+c.h+';--o:'+(c.i===0?2:c.i===1?1:0)+';--m:'+c.m+'"><span class="pl" aria-hidden="true">'+x.place+'</span><div class="nm">'+esc(x.name)+'</div><div class="pt"><span class="cu" data-to="'+x.pts+'">0</span><small>PKT</small></div>'+(x.ex.length&&x.ex[0]!==''?(ev.heads.length>=6?(function(){var t=-1;ev.heads.forEach(function(h,i){if(/^total$/i.test(h))t=i});return t>-1?'<div class="ex">Suma wszystkich rund: '+esc(x.ex[t])+'</div>':''})():'<div class="ex">'+esc(ev.heads[0])+': '+esc(x.ex[0])+'</div>'):'')+'</article>'}).join('')+'</div>'}
  var exC=ev.heads.length,mx=exC>=6,rc=[],ti=-1;ev.heads.forEach(function(h,i){if(/^\d+$/.test(h))rc.push(i);else if(/^total$|^suma$/i.test(h))ti=i});var rmax=1;if(mx)L.forEach(function(x){rc.forEach(function(i){var v=toNum(x.ex[i]);if(v>rmax)rmax=v})});
app.classList.toggle('mx',mx);app.style.setProperty('--nc',exC);
var rows=L.map(function(x,i){var dset={};if(mx&&ev.drop&&rc.length>ev.drop){var vs=rc.map(function(k){return{k:k,v:toNum(x.ex[k])||0}}).sort(function(a,b){return a.v-b.v||b.k-a.k}),sm=vs.reduce(function(a,b){return a+b.v},0),dp=vs.slice(0,ev.drop);if(Math.abs(sm-dp.reduce(function(a,b){return a+b.v},0)-x.pts)<.01)dp.forEach(function(o){dset[o.k]=1})}
return'<div class="rw'+(i<3?' t'+(i+1):'')+'" style="--i:'+i+';--w:'+(x.pts/max).toFixed(4)+'" data-n="'+esc(low(x.name))+'"><span class="n">'+x.place+'</span><span class="nm">'+esc(x.name)+'</span><span class="br"><i></i></span><span class="pp">'+fmt(x.pts)+'</span>'+(exC?'<span class="xcol">'+x.ex.map(function(v,k){var n=toNum(v),z=mx&&rc.indexOf(k)>-1;return'<span class="xx'+(dset[k]?' dr':'')+(z&&!n?' z':'')+(k===ti?' tt':'')+'" data-l="'+esc(lbl(ev.heads[k]))+'"'+(z&&n?' style="--h:'+(n/rmax).toFixed(3)+'"':'')+'>'+(z&&!n?'–':esc(v))+'</span>'}).join('')+'</span>':'')+'</div>'}).join('');
  var hdr='<div class="hdr"><span>Miejsce</span><span>Zawodnik</span><span class="b"></span><span class="r">Punkty</span>'+(exC?'<span class="xcol x">'+ev.heads.map(function(h){return'<span style="text-align:right">'+esc(lbl(h))+'</span>'}).join('')+'</span>':'')+'</div>';
  app.style.setProperty('--ex',exC&&!mx?(exC*108)+'px':'0px');
  app.innerHTML=podHTML+'<div class="lst"><div class="lh"><h2>Pełna klasyfikacja</h2><label class="srch"><input type="search" id="q" placeholder="Szukaj zawodnika" aria-label="Szukaj zawodnika"></label></div>'+hdr+''+(mx&&ev.drop?'<p class="lg">Przekreślone wyniki to '+ev.drop+' najsłabsze rundy. Nie wliczają się do klasyfikacji.</p>':'')+'<div id="rows">'+(rows||'<div class="empty">Brak wyników w tej zakładce.</div>')+'</div></div><p class="note">Plik z wynikami: <b>wyniki/wyniki.xlsx</b> · <label>Podgląd własnego pliku<input type="file" id="pf" accept=".xlsx" hidden></label></p>';
  requestAnimationFrame(function(){requestAnimationFrame(function(){app.classList.add('go');var p=$('#pod');if(p)p.classList.add('go');$$('.cu',app).forEach(countUp)})});
  $$('.rw',app).forEach(function(r){r.addEventListener('click',function(){if(app.classList.contains('mx')&&innerWidth<=900)r.classList.toggle('open')})});var q=$('#q');q.addEventListener('input',function(){var v=low(q.value.trim());$$('.rw',app).forEach(function(r){r.style.display=!v||r.dataset.n.indexOf(v)>-1?'':'none'})});
  $('#pf').addEventListener('change',function(e){var f=e.target.files[0];if(f){upd='';f.arrayBuffer().then(load).catch(fail)}})}
tabsEl.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;active=+b.dataset.i;app.classList.remove('go');render()});
function load(buf){return readWB(buf).then(function(sh){events=sh.filter(function(s){return!/^(_|instrukcja$)/i.test(s.name)}).map(parse).filter(Boolean);if(!events.length)throw new Error('Nie znaleziono arkusza z kolumnami Zawodnik i Punkty');active=0;app.classList.remove('go');render()})}
function fail(err){app.innerHTML='<div class="empty"><b>Nie udało się wczytać wyników.</b><br>'+esc(err.message||err)+'<br><br><label class="note"><label>Wybierz plik wyniki.xlsx z komputera<input type="file" id="pf2" accept=".xlsx" hidden></label></label></div>';var p=$('#pf2');if(p)p.addEventListener('change',function(e){var f=e.target.files[0];if(f)f.arrayBuffer().then(load).catch(fail)})}
function getX(u){return fetch(u+'?t='+Date.now()).then(function(r){if(!r.ok)throw new Error('Brak pliku wyniki/wyniki.xlsx');return r})}
getX('wyniki/wyniki.xlsx').then(function(r){var lm=r.headers.get('Last-Modified');if(lm){var dt=new Date(lm);if(!isNaN(dt))upd=dt.toLocaleDateString('pl-PL')}return r.arrayBuffer()}).catch(function(){return getX('wyniki/wyniki.xlsx.b64.txt').then(function(r){return r.text()}).then(function(t){var bin=atob(t.replace(/\s/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);upd='';return u.buffer})}).then(load).catch(fail);
})();
</script>
